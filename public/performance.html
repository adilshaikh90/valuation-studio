<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance | Valuation Studio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <nav class="nav">
        <!-- Navigation matching other pages... -->
        <div class="nav-brand"><a href="/dashboard.html">Valuation Studio</a></div>
        <div class="nav-ticker" id="currentTickerDisplay"></div>
        <div class="nav-links">
            <a href="dashboard.html">Overview</a>
            <a href="football-field.html">Football Field</a>
            <a href="valuation.html">Valuation</a>
            <a href="comps.html">Comps</a>
            <a href="lbo-nav.html">LBO & NAV</a>
            <a href="quant.html">Quant Lab</a>
            <a href="performance.html" class="active">Performance</a>
            <a href="news.html">News</a>
            <a href="download.html">Download</a>
        </div>
        <div class="nav-user">
            <span id="userEmail"></span>
            <button class="btn btn-ghost" onclick="app.logout()">Logout</button>
        </div>
    </nav>
    <main class="container">
        <header class="page-header">
            <h1>Historical Performance</h1>
            <div class="time-filters tabs mt-2">
                <button class="tab-btn" data-period="1M">1M</button>
                <button class="tab-btn" data-period="3M">3M</button>
                <button class="tab-btn" data-period="6M">6M</button>
                <button class="tab-btn" data-period="1Y">1Y</button>
                <button class="tab-btn" data-period="3Y">3Y</button>
                <button class="tab-btn active" data-period="5Y">5Y</button>
            </div>
        </header>

        <section class="card chart-card">
            <div style="height: 400px;"><canvas id="perfChart"></canvas></div>
        </section>

        <section class="stats-grid mt-4">
            <div class="card stat-card"><h3>Total Return</h3><p id="totalReturn">-</p></div>
            <div class="card stat-card"><h3>CAGR</h3><p id="cagr">-</p></div>
            <div class="card stat-card"><h3>Max Drawdown</h3><p id="maxDrawdown">-</p></div>
            <div class="card stat-card"><h3>Volatility</h3><p id="volatility">-</p></div>
            <div class="card stat-card"><h3>Sharpe Ratio</h3><p id="sharpeRatio">-</p></div>
        </section>

        <section class="card mt-4 overflow-x-auto">
            <h3>Monthly Returns Heatmap</h3>
            <div id="heatmapContainer"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/performance.js"></script>
</body>
</html>
