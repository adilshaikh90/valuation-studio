<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Valuation Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.1">
  <link rel="stylesheet" href="css/components.css?v=2.1">
</head>
<body>
<div class="layout-with-sidebar">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="dashboard.html?v=2.1">
        <img src="images/logo-dark-theme.png?v=2.1" alt="Valuation Studio" class="sidebar-logo-img">
      </a>
    </div>
    <div class="sidebar-ticker-box">
      <div class="sidebar-ticker-row">
        <span id="sidebarTicker" class="sidebar-ticker-symbol">ADMIN</span>
        <span id="sidebarPrice" class="sidebar-ticker-price text-gold">Console</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html?v=2.1" class="sidebar-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> App Overview</a>
      <a href="admin.html?v=2.1" class="sidebar-item active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Admin Dashboard</a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebarUserEmail" class="sidebar-user-email"></span>
      <button class="btn btn-ghost btn-sm" onclick="app.logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Admin Dashboard</h1>
      <p class="page-subtitle">Platform user analytics, search metrics, and account controls</p>
    </div>

    <section class="stats-grid mt-4">
      <div class="card stat-card"><h3>Total Users</h3><p id="totalUsers">-</p></div>
      <div class="card stat-card"><h3>Total Searches</h3><p id="totalSearches">-</p></div>
      <div class="card stat-card"><h3>Searches Today</h3><p id="searchesToday">-</p></div>
      <div class="card stat-card"><h3>Top Ticker</h3><p id="topTicker" class="text-gold">-</p></div>
    </section>

    <div class="layout-grid mt-4">
      <section class="card chart-card">
        <h3>Searches (Last 30 Days)</h3>
        <div style="height: 300px;"><canvas id="searchesChart"></canvas></div>
      </section>
      <section class="card chart-card">
        <h3>Top 10 Tickers</h3>
        <div style="height: 300px;"><canvas id="topTickersChart"></canvas></div>
      </section>
    </div>

    <section class="card mt-4">
      <div class="flex justify-between align-center mb-4">
        <h2>User Management</h2>
        <input type="text" id="userSearch" placeholder="Search users..." class="input" style="max-width: 300px; padding: 0.5rem 0.75rem; background: var(--surface-2); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>
      <div class="overflow-x-auto">
        <table class="data-table" id="usersTable">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Created</th>
              <th>Last Login</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js?v=2.1"></script>
<script src="js/app.js?v=2.1"></script>
<script src="js/charts.js?v=2.1"></script>
<script src="js/admin.js?v=2.1"></script>
</body>
</html>
