<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Valuation Studio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand"><a href="/dashboard.html">Valuation Studio (Admin)</a></div>
        <div class="nav-links">
            <a href="dashboard.html">Back to App</a>
        </div>
        <div class="nav-user">
            <span id="userEmail"></span>
            <button class="btn btn-ghost" onclick="app.logout()">Logout</button>
        </div>
    </nav>
    <main class="container">
        <header class="page-header">
            <h1>Admin Dashboard</h1>
        </header>

        <section class="stats-grid mt-4">
            <div class="card stat-card"><h3>Total Users</h3><p id="totalUsers">-</p></div>
            <div class="card stat-card"><h3>Total Searches</h3><p id="totalSearches">-</p></div>
            <div class="card stat-card"><h3>Searches Today</h3><p id="searchesToday">-</p></div>
            <div class="card stat-card"><h3>Top Ticker</h3><p id="topTicker" class="text-gold">-</p></div>
        </section>

        <div class="layout-grid mt-4">
            <section class="card chart-card">
                <h3>Searches (Last 30 Days)</h3>
                <div style="height: 300px;"><canvas id="searchesChart"></canvas></div>
            </section>
            <section class="card chart-card">
                <h3>Top 10 Tickers</h3>
                <div style="height: 300px;"><canvas id="topTickersChart"></canvas></div>
            </section>
        </div>

        <section class="card mt-4">
            <div class="flex justify-between align-center mb-4">
                <h2>User Management</h2>
                <input type="text" id="userSearch" placeholder="Search users..." class="input" style="max-width: 300px;">
            </div>
            <div class="overflow-x-auto">
                <table class="data-table" id="usersTable">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
