<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Valuation Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, var(--bg-card) 0%, var(--bg-primary) 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .auth-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .auth-logo span {
            color: var(--accent-gold);
        }
        .auth-form {
            text-align: left;
        }
        .auth-error {
            display: none;
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="card auth-card">
        <a href="index.html" class="auth-logo">
            <img src="images/logo-dark-theme.png" alt="Valuation Studio" class="sidebar-logo-img">
        </a>
        
        <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; text-align: left;">Create an account</h2>
        
        <div id="auth-error" class="auth-error"></div>
        
        <form id="signup-form" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="input" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="input" placeholder="Min 8 characters" minlength="8" required>
            </div>
            
            <div class="form-group">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" class="input" placeholder="••••••••" minlength="8" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Sign Up</button>
        </form>
        
        <div class="mt-4" style="font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="login.html">Log in</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
