<!DOCTYPE html>
<html lang="en">
<head>
  <link rel='icon' type='image/png' href='images/favicon-192.png'>
  <link rel='shortcut icon' href='favicon.ico'>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Valuation Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2.1">
  <link rel="stylesheet" href="css/components.css?v=2.1">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 35%, #0f1c30 0%, #070c14 100%);
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      position: relative;
      box-sizing: border-box;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto;
      z-index: 10;
    }
    .auth-card {
      background-color: #0c1424;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(14, 165, 233, 0.05);
      box-sizing: border-box;
    }
    .auth-logo-img {
      max-height: 64px;
      max-width: 235px;
      width: 100%;
      height: auto;
      object-fit: contain;
      margin: 0 auto 1.75rem;
      display: block;
    }
    .auth-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin: 0 0 0.4rem;
      letter-spacing: -0.01em;
    }
    .auth-subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
      margin: 0 0 1.75rem;
    }
    .auth-error {
      display: none;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.35);
      color: #fda4af;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .auth-field {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .auth-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.45rem;
    }
    .auth-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #162032;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .auth-input:focus {
      border-color: #d97706;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.25);
      background: #1a273e;
    }
    .btn-submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem;
      background: linear-gradient(90deg, #c2410c 0%, #d97706 50%, #b45309 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(194, 65, 12, 0.35);
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(194, 65, 12, 0.45);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: #f59e0b;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* Cookie Banner */
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(8, 14, 24, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 2rem;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .cookie-banner.hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }
    .cookie-banner-content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .cookie-banner-text {
      color: #cbd5e1;
      font-size: 0.88rem;
      line-height: 1.45;
      flex: 1;
      min-width: 280px;
    }
    .cookie-banner-text strong {
      color: #ffffff;
      font-weight: 600;
    }
    .cookie-link {
      color: #94a3b8;
      text-decoration: underline;
      margin-left: 0.35rem;
    }
    .cookie-link:hover {
      color: #cbd5e1;
    }
    .cookie-banner-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .btn-cookie-decline {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 0.55rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cookie-decline:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-cookie-accept {
      background: #d97706;
      border: none;
      color: #0f172a;
      border-radius: 6px;
      padding: 0.55rem 1.35rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
    }
    .btn-cookie-accept:hover {
      background: #f59e0b;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html?v=2.1">
        <img src="images/logo-dark-theme.png?v=3.0" alt="Valuation Studio" class="auth-logo-img">
      </a>
      
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the institutional valuation platform</p>
      
      <div id="auth-error" class="auth-error"></div>
      
      <form id="signup-form">
        <div class="auth-field">
          <label for="email" class="auth-label">EMAIL ADDRESS</label>
          <input type="email" id="email" class="auth-input" placeholder="you@example.com" required autocomplete="username">
        </div>
        
        <div class="auth-field">
          <label for="password" class="auth-label">PASSWORD</label>
          <input type="password" id="password" class="auth-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="auth-field">
          <label for="confirm-password" class="auth-label">CONFIRM PASSWORD</label>
          <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
        
        <button type="submit" id="signupBtn" class="btn-submit">Create Account</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html?v=2.1">Sign in</a>
      </div>
    </div>
  </div>

  <!-- Cookie & Analytics Notice Banner -->
  <div id="cookieNoticeBanner" class="cookie-banner">
    <div class="cookie-banner-content">
      <div class="cookie-banner-text">
        <strong>Cookie &amp; Analytics Notice</strong> - We use Google Analytics to understand how the tool is used. No personal financial data is included in analytics events. You can opt out at any time. <a href="#" onclick="alert('Valuation Studio Privacy Policy: We do not sell or store personal financial search data without consent.'); return false;" class="cookie-link">Privacy Policy</a>
      </div>
      <div class="cookie-banner-actions">
        <button type="button" class="btn-cookie-decline" onclick="handleCookieConsent(false)">Decline</button>
        <button type="button" class="btn-cookie-accept" onclick="handleCookieConsent(true)">Accept Analytics</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2.1"></script>
  <script src="js/app.js?v=2.1"></script>
  <script src="js/auth.js?v=2.1"></script>
  <script>
    function handleCookieConsent(accepted) {
      localStorage.setItem('vs_cookie_consent', accepted ? 'accepted' : 'declined');
      const banner = document.getElementById('cookieNoticeBanner');
      if (banner) banner.classList.add('hidden');
    }
    document.addEventListener('DOMContentLoaded', () => {
      const consent = localStorage.getItem('vs_cookie_consent');
      if (consent) {
        const banner = document.getElementById('cookieNoticeBanner');
        if (banner) banner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
